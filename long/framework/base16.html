/* 1920x1080 stage. The 9:16 Short is the centre column x 656..1264 (608 px), scaled x1.776.
   Keep everything that matters inside x 680..1240. Captions sit at y 740..860 (above the Shorts UI). */
#stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1B1F3B; font-family: 'Fredoka', sans-serif; color: #fff; }
svg.full { position: absolute; left: 0; top: 0; }
svg text { font-family: 'Fredoka', sans-serif; }
.ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }

.chip { position: absolute; left: 0; top: 62px; width: 1920px; text-align: center; }
.chip span { display: inline-block; font-size: 28px; font-weight: 600; color: #1B1F3B; background: #3DDCFF; padding: 6px 22px; border-radius: 999px; }
.letters span { display: inline-block; }
#cap { position: absolute; left: 700px; top: 748px; width: 520px; text-align: center; font-size: 44px; line-height: 1.16; font-weight: 700; }
#cap .chunk { display: none; }
#cap .chunk span { display: inline-block; margin: 0 0.11em; }
.lbl { position: absolute; margin: 0; font-weight: 700; font-size: 32px; }
.note { position: absolute; width: 300px; padding: 22px 24px; background: #FFD23F; color: #1B1F3B; font-size: 30px; font-weight: 600; line-height: 1.15; border-radius: 10px; transform-origin: 50% 0; box-shadow: 0 10px 0 #14172C; }
.note b { display: block; font-size: 22px; letter-spacing: 2px; margin-bottom: 8px; color: #3A4170; }
.card { position: absolute; padding: 18px 22px; border-radius: 22px; background: #2B2F45; border: 4px solid #3A4170; font-size: 30px; font-weight: 600; color: #EEF0F7; }

#wingR { position: absolute; right: 40px; top: 990px; white-space: nowrap; text-align: right; font-size: 22px; letter-spacing: 5px; font-weight: 600; color: #2E3566; }
#guide { position: absolute; left: 656px; top: 0; width: 608px; height: 1080px; outline: 3px dashed rgba(255,92,92,0.7); display: none; pointer-events: none; }

<script>
const DATA = __TIMING__;
const TIMING = DATA.chunks;
const S = DATA.scenes;
const END = DATA.end;
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const smooth = (x) => x * x * (3 - 2 * x);
const bump = (x) => Math.sin(Math.PI * clamp(x));
const tf = (el, s) => el.setAttribute('transform', s);
const about = (cx, cy, s) => `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`;
const pop = (el, k) => { el.style.opacity = k > 0 ? 1 : 0; el.style.transform = `scale(${outBack(k)})`; };
const popS = (el, k, cx, cy, extra = '') => { el.style.opacity = k > 0 ? 1 : 0; tf(el, about(cx, cy, Math.max(0.0001, outBack(k))) + ' ' + extra); };
const fade = (el, k) => { el.style.opacity = k; };
const slideIn = (el, k, dx, dy = 0) => { const e = outCubic(k); el.style.opacity = k > 0 ? 1 : 0; el.style.transform = `translate(${(1 - e) * dx}px, ${(1 - e) * dy}px)`; };
const lerp = (a, b, k) => a + (b - a) * k;
const at = (el, x, y, s = 1, r = 0) => tf(el, `translate(${x} ${y}) rotate(${r}) scale(${s})`);
const wob = (u, f = 3, a = 1) => a * Math.sin(u * f);
const NS = 'http://www.w3.org/2000/svg';
const mk = (parent, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const use = (parent, href, attrs = {}) => { const u = mk(parent, 'use', attrs); u.setAttribute('href', href); return u; };
const dash = (el) => { const L = el.getTotalLength(); el.style.strokeDasharray = L; el.dataset.len = L; };
const draw = (el, k) => { if (!el.dataset.len) dash(el); el.style.strokeDashoffset = el.dataset.len * (1 - k); el.style.opacity = k > 0 ? 1 : 0; };
const num = (el, k, v, fmt) => { el.textContent = fmt(Math.round(v * outCubic(k))); };
const comma = (n) => n.toLocaleString('en-US');
function pathOf(fn, x0, x1, n, upto = 1) {
  let d = ''; const m = Math.max(1, Math.round(n * upto));
  for (let i = 0; i <= m; i++) { const xn = i / n; const x = x0 + (x1 - x0) * xn; d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + fn(xn).toFixed(1); }
  return d;
}
function letters(container, text) {
  return [...text].map((ch) => { const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; container.appendChild(s); return s; });
}
const lettersIn = (L, t0, step = 0.04) => (t) => L.forEach((el, i) => { const k = prog(t, t0 + i * step, t0 + 0.3 + i * step); el.style.transform = `translateY(${(1 - outCubic(k)) * 30}px) scale(${outBack(k)})`; el.style.opacity = k > 0 ? 1 : 0; });
let SEED = 11; const rnd = () => { SEED = (SEED * 16807) % 2147483647; return (SEED - 1) / 2147483646; };

const WORDS = [];
TIMING.forEach((c) => c.words.forEach((w) => WORDS.push({ k: w.w.toLowerCase().replace(/^[^\w]+|[.,:?!]+$/g, '').replace(/[.,:?!…]+$/g, ''), t: w.t })));
function T(word, n = 1) { let c = 0; for (const w of WORDS) if (w.k === word && ++c === n) return w.t; throw new Error('anchor ' + word + n); }
const traces = [...document.querySelectorAll('#traces path')];
traces.forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let CHAPTER = null;
if (location.hash === '#guide') $('guide').style.display = 'block';
<!--JS-->
// captions
const cap = $('cap');
const CH = TIMING.map((c) => {
  const div = document.createElement('div'); div.className = 'chunk'; cap.appendChild(div);
  const spans = c.words.map((w) => { const s = document.createElement('span'); s.textContent = w.w; div.appendChild(s); return s; });
  return { div, spans, c };
});
function captions(t) {
  CH.forEach((ch, i) => {
    const next = i + 1 < CH.length ? CH[i + 1].c.start : END + 1;
    const on = t >= ch.c.start && t < next;
    ch.div.style.display = on ? 'block' : 'none';
    if (!on) return;
    let cur = -1;
    ch.c.words.forEach((w, j) => { if (t >= w.t) cur = j; });
    ch.spans.forEach((s, j) => {
      const w = ch.c.words[j];
      const k = prog(t, w.t, w.t + 0.12);
      s.style.opacity = t >= w.t ? 1 : 0;
      s.style.color = j === cur ? '#FFD23F' : '#FFFFFF';
      s.style.transform = `scale(${0.8 + 0.2 * outBack(k)})`;
    });
  });
}
<!--F-->
if (CHAPTER) { $('wingL').textContent = CHAPTER.num; $('wingR').textContent = 'LITTLE ELECTRON · ' + CHAPTER.name; }
function render(t) {
  $('wingL').style.opacity = 0.5 + 0.5 * outCubic(prog(t, 0, 0.8)); $('wingL').style.transform = `translateY(${8 * Math.sin(t * 0.8)}px)`;
  traces.forEach((p, i) => { const k = outCubic(prog(t, 0.05 * i, 0.7 + 0.05 * i)); p.style.strokeDashoffset = p.dataset.len * (1 - k); });
  $('pads').style.opacity = prog(t, 0.6, 0.8);
  for (let i = 0; i < S.length; i++) {
    const a = S[i], b = i + 1 < S.length ? S[i + 1] : END + 10;
    const on = t >= a && t < b;
    const g = $('s' + (i + 1)), o = $('o' + (i + 1));
    if (g) g.style.display = on ? 'inline' : 'none';
    if (o) o.style.display = on ? 'block' : 'none';
    if (!on) continue;
    const u = t - a;
    const e = i === 0 ? 1 : outCubic(prog(u, 0, 0.22));
    const sc = 1.05 - 0.05 * e;
    if (g) { tf(g, about(960, 540, sc)); g.style.opacity = e; }
    if (o) { o.style.transform = `scale(${sc})`; o.style.opacity = e; }
    F[i](u, t);
  }
  if (typeof ALWAYS === 'function') ALWAYS(t);
  captions(t);
}
render(0);
</script>
